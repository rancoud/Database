name: test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - '**.md'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
        php-version:
          - '8.4'
          - '8.5'
          - '8.6'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull
        run: docker compose pull --quiet

      - name: Build
        run: docker compose build --build-arg PHPVERSION=${{ matrix.php-version == '8.6' && '8.6.0RC4' || matrix.php-version }}

      - name: Lint
        if: matrix.php-version == '8.4'
        run: docker compose run lib composer lint

      - name: Test
        run: docker compose run lib composer test
